# Konfigurasi LLM Router (LiteLLM).
# Model local sudah diisi sesuai yang sudah Anda tes jalan: phi4-mini.
# Blok cloud (OpenRouter) SENGAJA masih dikomentari — jangan aktifkan
# sebelum data masking (Presidio/setara) sudah berjalan di context_builder.py.

model_list:
  - model_name: local-default
    litellm_params:
      model: ollama/phi4-mini
      api_base: http://ollama:11434   # nama service di docker-compose, bukan "localhost"

# Placeholder untuk Month 2 — jangan aktifkan sebelum security baseline siap:
